<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
<title id="t">TiagoSousa-droid | Futuristic hacker system</title><desc id="d">Painel hacker futurista com radar animado, código a cair, scanline, HUD e indicadores de sistema.</desc>
<defs>
